spring.application.name=gateway-dispatch-service
server.port=8092

spring.datasource.url=jdbc:postgresql://localhost:5450/payrelay
spring.datasource.username=payrelay
spring.datasource.password=payrelay
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6390

spring.kafka.bootstrap-servers=localhost:9100
spring.kafka.consumer.group-id=gateway-dispatch
spring.kafka.consumer.auto-offset-reset=earliest